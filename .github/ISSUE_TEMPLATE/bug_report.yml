name: Bug report
description: Report a problem in a published Patch test build.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Patch version
      description: Paste the output of omarchy-patch --version.
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System and audio setup
      description: Omarchy / Hyprland version, architecture, audio device and active layout.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include whether playback was active.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Errors, screenshots or recording
      description: Remove private information before posting.
